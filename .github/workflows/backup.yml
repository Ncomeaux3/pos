name: Backup

on:
  schedule:
    # 04:10 UTC, after the 09:00 UTC nightly run has long finished for the
    # previous day and well before the next one.
    - cron: '10 4 * * *'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check backup secrets
        env:
          PGURL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$PGURL" || { echo "BACKUP_DATABASE_URL is not set"; exit 1; }
          test -n "$BACKUP_REPO_TOKEN" || { echo "BACKUP_REPO_TOKEN is not set"; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is not set"; exit 1; }
          test -n "$REF" || { echo "SUPABASE_PROJECT_REF is not set"; exit 1; }

      - name: Install a matching pg_dump
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump
        env:
          # The session mode pooler on 5432, not the direct connection and not
          # transaction mode on 6543. GitHub runners are IPv4 only and the
          # direct host is IPv6 only; transaction mode does not give pg_dump the
          # session semantics it needs.
          PGURL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          mkdir -p out
          pg_dump "$PGURL" --no-owner --no-privileges \
            | gzip -9 > "out/pos-$(date -u +%Y-%m-%d).sql.gz"
          ls -lh out/

      # The per-module storage buckets (insurance PDFs, health records) are not
      # in a pg_dump. The CLI mirrors every bucket into the same repo, beside
      # the dumps. ss:/// with no bucket is all of them. A file deleted from a
      # bucket stays in the mirror; nothing prunes it, which for a backup is
      # the right way round.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Mirror storage
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          mkdir -p out/storage
          supabase storage cp -r ss:/// out/storage --experimental --project-ref "$REF"
          find out/storage -type f | wc -l

      - name: Checkout the backup repo
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/pos-backups
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: backups

      - name: Commit, and drop anything older than thirty days
        working-directory: backups
        run: |
          mkdir -p dumps storage
          cp ../out/*.sql.gz dumps/
          cp -r ../out/storage/. storage/
          find dumps -name '*.sql.gz' -mtime +30 -delete

          git config user.name 'pos-backup'
          git config user.email 'pos-backup@users.noreply.github.com'
          git add dumps storage
          # An unchanged tree means the dump was identical, which is not a
          # failure worth a red run.
          git diff --staged --quiet || git commit -m "Backup $(date -u +%Y-%m-%d)"
          git push

      # The cron-silence check. At 04:10 UTC the last 09:00 UTC nightly is 19
      # hours old and a missed one is 43, so 36 is the line. A failed run is
      # excluded on purpose: every job failing sent no digest either. Partial
      # counts as fired; the dashboard already surfaces single job failures.
      # After the commit, so the dump still lands when this goes red; a failed
      # scheduled run is what GitHub emails the owner about.
      # ponytail: any trigger counts, so a run by hand hides a dead cron for a
      # day. Add "and trigger_source = 'cron'" once the production cron has
      # fired; before that the filter would be red every morning.
      - name: Check the nightly fired
        env:
          PGURL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          runs=$(psql "$PGURL" -Atc "select count(*) from core.job_runs
            where finished_at > now() - interval '36 hours'
              and status in ('clean', 'partial')")
          echo "nightly runs in the last 36 hours: $runs"
          test "$runs" -gt 0 || { echo "no clean or partial nightly in 36 hours"; exit 1; }
