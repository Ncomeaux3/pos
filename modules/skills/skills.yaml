# The skill tree. This file is the source of truth: there is no edit UI.
#
# Every node has an id (stable, referenced by core.skill_links), a parent, a
# name, and optional keywords. Keywords drive deterministic classification:
# anything an entity's text matches is linked with classified_by 'rule' and
# confidence 1, and only the leftovers cost a model call.
#
# Keywords are matched case insensitively on word boundaries, so "go" will not
# match "going". Prefer specific terms; a keyword that fires on everything is
# worse than no keyword.
#
# Fork and edit freely. Deleting a node stops new links, it does not delete
# history: core.events keeps its own title snapshot.

nodes:
